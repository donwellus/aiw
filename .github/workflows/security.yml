name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Adicionar GOPATH/bin ao PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Instalar gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Escanear histórico
        run: gitleaks detect --config .gitleaks.toml --source . --redact --verbose --exit-code 1

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Adicionar GOPATH/bin ao PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Instalar govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Verificar vulnerabilidades
        run: govulncheck ./...

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5
